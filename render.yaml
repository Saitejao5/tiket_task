services:
  - type: web
    name: student-support-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://frontend-orcin-sigma-43.vercel.app
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_DNS_SERVERS
        value: 8.8.8.8,1.1.1.1